      ringDash: (s.bg > 0 ? (totalJpy > s.bg ? 81.68 : Math.max(0, (s.bg - totalJpy) / s.bg) * 81.68) : 0).toFixed(2) + ' 81.68',
      ringPct: s.bg > 0 ? (totalJpy > s.bg ? '超支' : Math.round((s.bg - totalJpy) / s.bg * 100) + '%') : '--',
      ringTextStyle: 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:' + (s.bg > 0 && totalJpy > s.bg ? '10px' : '11px') + ';color:' + (s.bg > 0 && totalJpy > s.bg ? '#B5524A' : '#3B6285'),
      popRemain: s.bg > 0 ? (s.bg - totalJpy < 0 ? '-' : '') + '¥ ' + Math.abs(Math.round(s.bg - totalJpy)).toLocaleString('en-US') : '尚未設定',
      popRemainStyle: 'font-size:17px;font-weight:700;color:' + (s.bg > 0 && totalJpy > s.bg ? '#B5524A' : '#4F7CA3'),
      popSpent: '¥ ' + Math.round(totalJpy).toLocaleString('en-US'),
      popBudget: s.bg > 0 ? '¥ ' + Math.round(s.bg).toLocaleString('en-US') : '尚未設定',
      hasBudget: s.bg > 0,
      remainLine: '剩餘 ' + (s.bg - totalJpy < 0 ? '-' : '') + '¥ ' + Math.abs(Math.round(s.bg - totalJpy)).toLocaleString('en-US'),
      remainStyle: 'font-size:12px;font-weight:500;color:' + (s.bg - totalJpy < 0 ? '#B5524A' : '#C4691F'),
      budgetLine: s.bg > 0 ? '旅程預算 ¥ ' + Math.round(s.bg).toLocaleString('en-US') : '尚未設定旅程預算',
      bsOpen: s.bs, bf: s.bf, setBf: (e) => this.setState({ bf: e.target.value }),
      openBudget: () => this.setState({ bs: true, bf: s.bg > 0 ? String(s.bg) : '' }),
      closeBudget: () => this.setState({ bs: false }),
      saveBudget: () => { const v = parseFloat(String(this.state.bf).replace(/,/g, '')); this.upd({ bg: v > 0 ? v : 0, bs: false }); },
      xsOpen: !!s.xs, xf: s.xf, xTitle: s.xs === 'new' ? '新增花費' : '編輯花費', xCanDel: s.xs !== 'new',
      openNewX: () => this.setState({ xs: 'new', xf: { name: '', amt: '', cur: 'JPY', date: s.ff !== 'all' ? s.ff : '3/11', cat: 'food' } }),
      setXn: (e) => this.setState({ xf: Object.assign({}, this.state.xf, { name: e.target.value }) }),
      setXa: (e) => this.setState({ xf: Object.assign({}, this.state.xf, { amt: e.target.value }) }),
      setXjpy: () => this.setState({ xf: Object.assign({}, this.state.xf, { cur: 'JPY' }) }),
      setXtwd: () => this.setState({ xf: Object.assign({}, this.state.xf, { cur: 'TWD' }) }),
      xJpyStyle: chip(s.xf.cur === 'JPY') + ';min-height:48px;font-size:15px', xTwdStyle: chip(s.xf.cur === 'TWD') + ';min-height:48px;font-size:15px',
      xDates: DATES.map((d) => ({ label: d, pick: () => this.setState({ xf: Object.assign({}, this.state.xf, { date: d }) }), style: chip(s.xf.date === d) })),
      xCats: CATS.map((c) => ({ label: c.label, d: c.d, fill: s.xf.cat === c.k ? '#3B6285' : '#8A8A85', pick: () => this.setState({ xf: Object.assign({}, this.state.xf, { cat: c.k }) }),
        style: chip(s.xf.cat === c.k) + ';min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px' })),
      closeX: () => this.setState({ xs: null }), saveX: () => this.saveX(), delX: () => this.delX(),
      efCats: CATS.map((c) => ({ label: c.label, d: c.d, fill: s.ef.cat === c.k ? '#3B6285' : '#8A8A85', pick: () => this.setState({ ef: Object.assign({}, this.state.ef, { cat: c.k }) }),
        style: chip(s.ef.cat === c.k) + ';min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px' })),
      closeSheet: () => this.setState({ sheet: null }), saveSheet: () => this.saveSheet(), delItem: () => this.delItem()
    };
  }
  render() { return view(this.renderVals()); }
}

ReactDOM.createRoot(document.getElementById('root')).render(_h(Component));
})();
</script>
